[package]
name = "mapdeck"
version = "0.1.0"
description = "MAPdeck desktop launcher prototype"
license = "MIT"
authors = ["Angad-Microslop"]

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
